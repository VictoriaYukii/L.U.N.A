<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My account — Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/api.js"></script>
</head>
<body>
<main id="main">
<section class="cols even">
  <div><h2>profile</h2><div class="panel"><div class="stats" id="profile" style="border:0;margin:0"></div></div></div>
  <div><h2>my quota · 30 days</h2><div class="panel"><div class="mh"><div class="big" id="used" style="font-size:28px"></div><div class="sub" id="ofLimit"></div></div><div class="cells" id="cells" role="img"></div></div></div>
</section>
<section class="cols even">
  <div><h2>change password</h2><div class="panel"><form id="pwform">
    <label for="op">current password</label><input id="op" type="password" autocomplete="current-password" required>
    <label for="np">new password</label><input id="np" type="password" autocomplete="new-password" required>
    <label for="np2">confirm new password</label><input id="np2" type="password" autocomplete="new-password" required>
    <div class="row"><button type="submit">Update password</button></div><p class="msg" id="pmsg" role="status"></p>
  </form></div></div>
  <div><h2>my data</h2><div class="panel">
    <p class="note" style="margin-top:0">// your requests are stored on the server under your account.</p>
    <div class="row"><button class="ghost" id="exp">Export my requests (CSV)</button><button class="ghost" id="sample">Replace with sample data</button><button class="ghost" id="clear">Clear my log</button></div>
    <p class="msg" id="dmsg" role="status"></p>
  </div></div>
</section>
</main>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/account.js"></script>
</body>
</html>
