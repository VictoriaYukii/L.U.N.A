<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Performance — Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/api.js"></script>
</head>
<body>
<main id="main">
<section><div id="range"></div></section>
<section><div class="kpis" id="kpis"></div></section>
<section class="cols even">
  <div><h2>latency per day</h2><div class="panel"><svg id="lat" role="img"></svg><div class="legend" style="margin-top:10px"><span><b style="background:var(--c2)"></b>p50</span><span><b style="background:var(--c1)"></b>p95</span></div></div></div>
  <div><h2>error rate per day</h2><div class="panel"><svg id="err" role="img"></svg></div></div>
</section>
<section class="cols even">
  <div><h2>latency distribution</h2><div class="panel" id="hist"></div></div>
  <div><h2>slowest requests</h2><div class="panel scroll"><table><thead id="slowhead"></thead><tbody id="slow"></tbody></table></div></div>
</section>
</main>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/performance.js"></script>
</body>
</html>
