<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Control Room</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>

<main class="stage" id="stage">
  <div class="boot" id="boot" aria-hidden="true"></div>

  <div class="card" id="card">
    <div class="orb" aria-hidden="true"></div>
    <h1>CONTROL ROOM</h1>
    <p class="sub">&gt; authenticate to continue</p>

    <div class="tabs" id="tabs" data-mode="login" role="tablist">
      <button type="button" id="tLogin" class="on" role="tab">log in</button>
      <button type="button" id="tSign" role="tab">create account</button>
      <span class="slider" aria-hidden="true"></span>
    </div>

    <form id="form" novalidate>
      <div class="field">
        <input id="user" name="username" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="user">username</label><i></i>
      </div>
      <div class="field">
        <input id="pass" name="password" type="password" placeholder=" " autocomplete="current-password" required>
        <label for="pass">password</label><i></i>
        <button type="button" class="eye" id="eye" aria-label="Show password">show</button>
      </div>
      <div class="reveal" id="confirmWrap">
        <div>
          <div class="field">
            <input id="confirm" type="password" placeholder=" " autocomplete="new-password" disabled>
            <label for="confirm">confirm password</label><i></i>
          </div>
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="remember"><span></span>keep me signed in</label>
      <p class="msg" id="msg" role="alert" aria-live="polite"></p>
      <button class="go" id="go" type="submit"><span id="goText">Log in</span><i class="bar"></i></button>
    </form>
    <p class="note">// accounts are stored in this browser only</p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
