<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerts — Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/api.js"></script>
</head>
<body>
<main id="main">
<section><h2>active alerts</h2><div id="list"></div></section>
<section id="usersWrap"><h2>quota by user · 30 days</h2><div class="panel scroll"><table><thead><tr><th>user</th><th class="n">tokens</th><th class="n">quota</th><th class="n">used</th></tr></thead><tbody id="usersPanel"></tbody></table></div></section>
<section><h2>alert rules</h2><div class="panel">
  <div id="rules"></div>
  <div id="ruleform">
    <div class="fgrid">
      <div><label for="warn">warn when budget / quota used (%)</label><input id="warn" type="number" min="1" max="100"></div>
      <div><label for="p95">p95 latency above (ms)</label><input id="p95" type="number" min="1"></div>
      <div><label for="err">error rate above (%)</label><input id="err" type="number" min="0" max="100" step="0.5"></div>
    </div>
    <p class="note" id="saved" role="status"></p>
    <p class="note">// alerts are evaluated live from the logged data in the current view.</p>
  </div>
</div></section>
</main>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/alerts.js"></script>
</body>
</html>
